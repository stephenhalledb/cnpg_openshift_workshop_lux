apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: 'cluster-restore-sh'
spec:
  instances: 1
  imageName: 'docker.enterprisedb.com/k8s/postgresql:17.7'

  storage:
    size: 512Mi

  bootstrap:
    recovery:
      source: cluster-sh
      recoveryTarget:
        targetTime: '2026-11-18 23:26:59.370186'
        #backupID: 20230411T115526
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cluster-sh-objectstore
  externalClusters:
    - name: cluster-sh
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cluster-sh-objectstore
          serverName: cluster-sh
