apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${objectstore_name}
spec:
  retentionPolicy: "1d"
  configuration:
    destinationPath: "$s3_destination_path"
    endpointURL: "$s3_endpoint_url"
    s3Credentials:
      accessKeyId:
        name: minio-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-creds
        key: ACCESS_SECRET_KEY
    data:
      immediateCheckpoint: true
