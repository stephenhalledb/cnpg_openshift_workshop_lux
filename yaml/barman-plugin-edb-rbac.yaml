# The Barman Cloud Plugin release manifest grants its rights on the community API
# group postgresql.cnpg.io only. The EDB operator uses postgresql.k8s.enterprisedb.io.
# Without these rights OpenShift (OwnerReferencesPermissionEnforcement) refuses that
# the plugin creates the Role "<cluster>-barman-cloud" owned by the Cluster:
#   "cannot set blockOwnerDeletion if an ownerReference refers to a resource you
#    can't set finalizers on"
# Applied by 05_install_barman_cloud_plugin.sh. ${operator_namespace} is replaced by envsubst.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-barman-cloud-edb
rules:
- apiGroups:
  - postgresql.k8s.enterprisedb.io
  resources:
  - clusters/finalizers
  verbs:
  - update
- apiGroups:
  - postgresql.k8s.enterprisedb.io
  resources:
  - backups
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-barman-cloud-edb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-barman-cloud-edb
subjects:
- kind: ServiceAccount
  name: plugin-barman-cloud
  namespace: ${operator_namespace}
