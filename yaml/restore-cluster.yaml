apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: "$cluster_restore"
spec:
  instances: 1
  imageName: "$postgres_upgrade_image"
  imagePullSecrets:
  - name: postgresql-operator-pull-secret

  storage:
    size: $postgres_storage

  walStorage:
    resizeInUseVolumes: true
    size: $postgres_wal_storage

$affinity

  bootstrap:
    recovery:
      source: ${cluster_name}

  resources:
    requests:
      memory: "$postgres_memory"
      cpu: "$postgres_cpu"
    limits:
      memory: "$postgres_memory_max"
      cpu: "$postgres_cpu_max"

  # The restored cluster archives its own WALs in the same bucket. The folder
  # (serverName) is unique for each restore: the plugin refuses to archive in a
  # folder that already contains WALs ("Expected empty archive"), which would
  # happen when the restore cluster is deleted and created again with the same name.
  # It must not be the folder of the source cluster either.
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: ${objectstore_name}
      serverName: ${restore_server_name}

  # Recovery from the object store with the Barman Cloud Plugin. serverName is the
  # folder of the source cluster in the bucket (default of the plugin: its name)
  externalClusters:
  - name: ${cluster_name}
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: ${objectstore_name}
        serverName: ${cluster_name}
