apiVersion: postgresql.k8s.enterprisedb.io/v1
kind: Cluster
metadata:
  name: "$cluster_restore"
spec:
  instances: 1
  imageName: "$postgres_upgrade_image"
  imagePullSecrets:
  - name: postgresql-operator-pull-secret

  storage:
    size: $postgres_storage

  walStorage:
    resizeInUseVolumes: true
    size: $postgres_wal_storage

$affinity

  bootstrap:
    recovery:
      source: ${cluster_name}

  resources:
    requests:
      memory: "$postgres_memory"
      cpu: "$postgres_cpu"
    limits:
      memory: "$postgres_memory_max"
      cpu: "$postgres_cpu_max"

  # The restored cluster archives its own WALs and backups in the same bucket, in the
  # folder of its own name (serverName defaults to the cluster name, so the source
  # cluster folder is not overwritten)
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: ${objectstore_name}

  # Recovery from the object store with the Barman Cloud Plugin. serverName is the
  # folder of the source cluster in the bucket (default of the plugin: its name)
  externalClusters:
  - name: ${cluster_name}
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: ${objectstore_name}
        serverName: ${cluster_name}
