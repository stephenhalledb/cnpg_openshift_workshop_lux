apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${objectstore_name}
spec:
  retentionPolicy: "1d"
  configuration:
    destinationPath: "$s3_destination_path"
    s3Credentials:
      accessKeyId:
        name: minio-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-creds
        key: ACCESS_SECRET_KEY
      sessionToken:
        name: minio-creds
        key: ACCESS_SESSION_TOKEN
    data:
      immediateCheckpoint: true
    wal:
      compression: gzip
      maxParallel: 8
      encryption: AES256
